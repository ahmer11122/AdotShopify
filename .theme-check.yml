root: .
ignore:
  - .reference/**
  - reference/**
  - .agent/**
  - node_modules/**
  - /interactive-gallery.liquid
AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 100000
AssetSizeJavaScript:
  enabled: true
  # Header system (adot-header-system.js) is intentionally readable and ~39KB.
  # theme.js stays minified under ~10KB for the shared cart helpers.
  threshold_in_bytes: 50000
ImgWidthAndHeight:
  enabled: true
ParserBlockingScript:
  enabled: true

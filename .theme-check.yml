root: .
ignore:
  - .reference/**
  - reference/**
  - .agent/**
  - node_modules/**
  - /interactive-gallery.liquid
AssetSizeCSS:
  enabled: true
  threshold_in_bytes: 100000
AssetSizeJavaScript:
  enabled: true
  # Shopify default recommendation (10KB uncompressed per asset).
  # Header + Threadline are split into modules that each stay under this limit.
  threshold_in_bytes: 10000
ImgWidthAndHeight:
  enabled: true
ParserBlockingScript:
  enabled: true
